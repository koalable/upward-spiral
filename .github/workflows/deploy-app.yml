# Publishes the home-screen app (app/) to Firebase Hosting, and the notification server (functions/),
# whenever either changes on main.
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT (see docs/APP-SETUP.md).
name: Deploy app
on:
  push:
    branches: [main]
    paths: ["app/**", "functions/**", "firebase.json", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is set up
        id: key
        env: { KEY: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: if [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::FIREBASE_SERVICE_ACCOUNT isn't set yet, so the app wasn't published. See docs/APP-SETUP.md."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.key.outputs.ok
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: upward-spiral-of-awesomeness
          channelId: live
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok
        with: { node-version: 22 }
      - name: Deploy notification server
        if: steps.key.outputs.ok
        env: { KEY: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci --omit=dev)
          npx --yes firebase-tools@14 deploy --only functions --project upward-spiral-of-awesomeness --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
